services:
  mariadb:
    image: mariadb:11
    container_name: cycling-mariadb
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cycling-guarded-entrypoint.sh"]
    command:
      - mariadbd

    environment:
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"

    volumes:
      - /srv/cycling/data/mariadb:/var/lib/mysql
      - ./mariadb/init/10-create-platform-databases.sh:/docker-entrypoint-initdb.d/10-create-platform-databases.sh:ro
      - ./mariadb/guarded-entrypoint.sh:/usr/local/bin/cycling-guarded-entrypoint.sh:ro

    ports:
      - "${MARIADB_PORT}:3306"

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cycling-platform:
    build:
      context: ../../cycling-platform
      dockerfile: Dockerfile
    image: cycling-platform:dev
    # Atomic rename retains the replacement inode's ownership. Use the host tim
    # identity so credential and log writes remain owned by the operator.
    user: "${CYCLING_RUNTIME_UID:?run scripts/compose.sh so the host tim UID is supplied}:${CYCLING_RUNTIME_GID:?run scripts/compose.sh so the host tim GID is supplied}"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      R_ENVIRON_USER: "/run/cycling-platform/runtime.Renviron"
      CYCLING_PLATFORM_RENVIRON_PATH: "/run/cycling-platform/runtime.Renviron"
      CYCLING_PLATFORM_EXECUTION_HOST: "${CYCLING_PLATFORM_EXECUTION_HOST:?run scripts/compose.sh so host identity is supplied dynamically}"

      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"

      STRAVA_CLIENT_ID: "${STRAVA_CLIENT_ID}"
      STRAVA_CLIENT_SECRET: "${STRAVA_CLIENT_SECRET}"

      GOOGLE_HEALTH_CLIENT_ID: "${GOOGLE_HEALTH_CLIENT_ID}"
      GOOGLE_HEALTH_CLIENT_SECRET: "${GOOGLE_HEALTH_CLIENT_SECRET}"

      NTFY_TOPIC: "${NTFY_TOPIC}"

    volumes:
      - /srv/cycling/logs/platform:/opt/cycling-platform/logs
      - /srv/cycling/config/platform:/run/cycling-platform:rw
    restart: "no"

  cycling-analytics:
    build:
      context: ../../cycling-analytics
      dockerfile: Dockerfile
    image: cycling-analytics:dev
    user: "${CYCLING_RUNTIME_UID:?run scripts/compose.sh so the host tim UID is supplied}:${CYCLING_RUNTIME_GID:?run scripts/compose.sh so the host tim GID is supplied}"
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - "${CYCLING_ANALYTICS_ENV_FILE:-/srv/cycling/config/analytics/runtime.Renviron}"
    environment:
      # The Compose network endpoint is infrastructure-owned. Keep these keys
      # out of runtime.Renviron so there is one effective source of truth.
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
    volumes:
      - /srv/cycling/data/analytics/output:/app/output
    restart: "no"

  cloudflare-pages-publisher:
    build:
      context: ./cloudflare-pages-publisher
      dockerfile: Dockerfile
    image: cycling-cloudflare-pages-publisher:wrangler-4.33.1
    environment:
      HOME: /tmp/wrangler-home
    volumes:
      - "${CYCLING_ANALYTICS_OUTPUT_DIR:-/srv/cycling/data/analytics/output}:/site:ro"
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"
    command:
      - pages
      - deploy
      - /site
